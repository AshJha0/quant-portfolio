[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qp-rust"
version = "3.0.0"
description = "Python bindings (PyO3) for the quant-portfolio Rust option and VaR engines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.maturin]
python-source = "python"
module-name = "qp_rust._core"
features = ["pyo3/extension-module"]
locked = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Wheels are built with cibuildwheel by the ci "wheels" job (kept as
# workflow artefacts) and by release.yml (attached to the GitHub Release);
# nothing is uploaded to PyPI. Inside the manylinux
# container rustup installs the channel pinned in rust/rust-toolchain.toml
# (the job passes it as QP_RUST_CHANNEL).
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build"
test-command = "python {project}/bindings/wheel_smoke.py qp_rust"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $QP_RUST_CHANNEL"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
environment-pass = ["QP_RUST_CHANNEL"]

# macOS wheels are built by the release workflow only (Apple silicon).
# Deployment target 14.0 (macOS Sonoma) leaves room for the C++23 library
# features the engines use; older targets are not built or tested.
[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
