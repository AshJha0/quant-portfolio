[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "qp-cpp"
version = "0.1.0"
description = "Python bindings (nanobind) for the quant-portfolio C++ option and VaR engines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/qp_cpp"]
wheel.py-api = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

# Wheels are built by the ci "wheels" job with cibuildwheel and kept as
# workflow artefacts; nothing is uploaded to PyPI. The engines need C++23
# (GCC 15 in CI), so the Linux build uses the manylinux_2_34 image and its
# gcc-toolset-15 rather than the image's default compiler.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build"
test-command = "python {project}/../wheel_smoke.py qp_cpp"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
before-all = "dnf -y install gcc-toolset-15-gcc-c++"
environment = { PATH = "/opt/rh/gcc-toolset-15/root/usr/bin:$PATH", CC = "gcc", CXX = "g++" }
