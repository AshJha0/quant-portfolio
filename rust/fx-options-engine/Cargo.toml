[package]
name = "fx-options-engine"
version = "1.0.0"
edition = "2021"
description = "Zero-dependency FX options pricing engine (Garman-Kohlhagen) — Rust twin of the Python reference project python/fx/01-options-pricing"
license = "MIT"
publish = false

[lib]
name = "fx_options_engine"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# ZERO external dependencies: std only.  The deterministic RNG, normal
# distribution functions and root finders are implemented in-crate.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
