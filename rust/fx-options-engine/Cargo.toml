[package]
name = "fx-options-engine"
version = "1.1.0"
edition = "2021"
description = "Zero-dependency FX options pricing engine (Garman-Kohlhagen): Rust twin of the Python reference project python/fx/01-options-pricing"
license = "MIT"
publish = false

[lib]
name = "fx_options_engine"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "fx_jsonl"
path = "src/bin/fx_jsonl.rs"

# No third-party dependencies: std plus the workspace's own qp-core, which
# holds the RNG, the normal distribution functions and Brent.
[dependencies]
qp-core = { path = "../core" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
