[package]
name = "eq-var-engine"
version = "0.3.0"
edition = "2021"
description = "Equity market-risk engine: historical / parametric / Monte Carlo VaR, Expected Shortfall and regulatory backtesting. Zero runtime dependencies (std only); port of the Python eq_var library with full repricing of European option legs."
license = "MIT"
publish = false

[lib]
name = "eq_var_engine"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# No third-party dependencies by design: std plus the workspace's own
# qp-core (RNG, Acklam guess, Cholesky kernel). The special functions are
# in-crate. See docs/METHODOLOGY.md.
[dependencies]
qp-core = { path = "../core" }

[dev-dependencies]
proptest = "1"
