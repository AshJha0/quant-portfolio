# Cargo workspace for the four Rust engines and their shared core.
#
# Run every cargo command from this directory. There is one Cargo.lock and
# one target directory (rust/target). Release profiles live here because
# cargo ignores [profile] sections in member manifests.
[workspace]
resolver = "3"
members = [
    "core",
    "equity-options-engine",
    "fx-options-engine",
    "equity-var-engine",
    "fx-var-engine",
    "rates-curves",
    "ull/ring",
    "ull/qpbf",
    "ull/book",
    "ull/bench",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
