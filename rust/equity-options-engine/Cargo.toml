[package]
name = "eq-options-engine"
version = "0.2.0"
edition = "2021"
description = "Zero-dependency Rust equity options pricing engine, cross-validated against the eq_options Python reference and the C++ engine"
license = "MIT"
publish = false

[lib]
name = "eq_options_engine"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "eq_jsonl"
path = "src/bin/eq_jsonl.rs"

# No third-party runtime dependencies (determinism and auditability). The
# RNG (SplitMix64 -> xoshiro256++) and the normal CDF (Cody's erfc) live in
# the workspace's std-only qp-core crate. proptest is test-only.
[dependencies]
qp-core = { path = "../core" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

# `--cfg before` builds the bench against the pre-change API only (used to
# record before/after numbers with one bench source).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(before)"] }
