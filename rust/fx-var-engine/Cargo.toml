[package]
name = "fx-var-engine"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Multi-currency FX VaR/ES engine (historical, parametric, Monte Carlo, stress); port of python/fx/03-var-es-engine with full repricing of European option legs"
license = "MIT"

[lib]
name = "fx_var_engine"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
qp-core = { path = "../core" }
# std plus the workspace's own qp-core (RNG, Cholesky kernel, thread
# helper); no third-party crates. Special functions are in-crate.

[dev-dependencies]
proptest = "1"
