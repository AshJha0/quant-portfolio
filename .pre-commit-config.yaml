# pre-commit hooks. Install once with:
#   pip install pre-commit && pre-commit install
# Run on everything with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(cmd|bat)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    # Same version as the lint job (requirements/ci-constraints.txt). The
    # rules live in ruff.toml at the root.
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(python|\.github/scripts|tests)/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    # Same major version as the clang-format CI job (clang-format-21). The
    # style lives in .clang-format at the root.
    hooks:
      - id: clang-format
        files: ^cpp/
        types_or: [c++, c]

  - repo: local
    hooks:
      # The pattern uses a character class so this file does not match itself.
      - id: banned-hiring-word
        name: banned hiring-process word
        language: pygrep
        entry: '(?i)intervie[w]'
        types: [text]
