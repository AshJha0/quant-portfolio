# pre-commit hooks. Install once with:
#   pip install pre-commit && pre-commit install
# Run on everything with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(cmd|bat)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    # Scoped to the repository tooling this round. The project sources carry
    # about 1,100 existing findings; widen `files` per project as each one is
    # cleaned (Phase 2).
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(\.github/scripts|tests)/

  - repo: local
    hooks:
      # The pattern uses a character class so this file does not match itself.
      - id: banned-hiring-word
        name: banned hiring-process word
        language: pygrep
        entry: '(?i)intervie[w]'
        types: [text]
