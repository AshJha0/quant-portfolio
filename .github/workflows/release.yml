# Tag-on-green release.
#
# Run from the Actions tab with a version (X.Y.Z) and, optionally, a commit.
# The workflow refuses unless:
#   * the commit is on main,
#   * the ci-ok check run on that exact commit concluded "success",
#   * CHANGELOG.md at that commit has a "## [X.Y.Z]" section,
#   * the tag vX.Y.Z does not exist yet.
# It then creates the tag vX.Y.Z on that commit and a GitHub Release whose
# notes are that CHANGELOG section.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (no leading v)"
        required: true
        type: string
      sha:
        description: "Commit to release (default: head of main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the Release
      checks: read      # read the ci-ok check run
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      INPUT_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate the version string
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi

      - name: Resolve the commit
        id: sha
        run: |
          if [ -n "$INPUT_SHA" ]; then
            sha=$(gh api "repos/$REPO/commits/$INPUT_SHA" --jq .sha)
          else
            sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          fi
          status=$(gh api "repos/$REPO/compare/main...$sha" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$sha is not on main (compare status: $status)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha"

      - name: ci-ok succeeded on this exact commit
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-ok&filter=latest" \
            --jq '[.check_runs[] | select(.head_sha == env.SHA)][0].conclusion // "missing"')
          echo "ci-ok on $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci-ok is '$conclusion' on $SHA; refusing to release"
            exit 1
          fi

      - name: Tag does not exist yet
        run: |
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Extract the CHANGELOG section
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the tag and the GitHub Release
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          gh release create "v$VERSION" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
