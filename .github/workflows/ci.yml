# Portfolio-wide CI.
#
#   discover   lists the Python projects and the extra each one installs
#   python     one job per project and Python version, each in a fresh venv
#   goldens    regenerated C++ headers and Rust modules match the JSON vectors
#   cpp        4 engines x {GCC 15, Clang 21}, Release, ctest
#   cpp-asan   4 engines, Clang 21, AddressSanitizer + UBSan
#   rust       4 crates, pinned toolchain, cargo test --release
#   hygiene    hard ban on the hiring-process word; voice report (report-only)
#   counts     sums executed pass counts into counts.json, then checks the docs
#   ci-ok      fails unless every job above succeeded; the only required check
#
# Third-party actions are pinned to full commit SHAs. Dependabot keeps them
# current (.github/dependabot.yml).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: find
        name: Find Python projects and their test extra
        run: python .github/scripts/discover_projects.py

  python:
    name: py ${{ matrix.project.slug }} (${{ matrix.python }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/ci-constraints.txt
            ${{ matrix.project.path }}/pyproject.toml
      - name: Create a venv for this project only
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install the project with its ${{ matrix.project.extra || 'base' }} dependencies
        working-directory: ${{ matrix.project.path }}
        env:
          SPEC: ${{ matrix.project.spec }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c "$GITHUB_WORKSPACE/requirements/ci-constraints.txt" \
            -e "$SPEC" pytest hypothesis
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
      - name: pytest
        working-directory: ${{ matrix.project.path }}
        run: |
          python -m pytest -p no:cacheprovider -ra \
            --junitxml="$RUNNER_TEMP/junit/junit.xml"
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py-${{ matrix.project.slug }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/junit/junit.xml
            ${{ runner.temp }}/pip-freeze.txt
          if-no-files-found: error
          retention-days: 30

  goldens:
    name: goldens --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Committed C++ headers and Rust modules match the golden JSON
        run: |
          set -euo pipefail
          for d in cpp/*/; do python "$d/tools/gen_golden_header.py" --check; done
          for d in rust/*/; do python "$d/tools/gen_golden_rs.py" --check; done

  cpp:
    name: cpp ${{ matrix.engine }} (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [equity-options-engine, equity-var-engine, fx-options-engine, fx-var-engine]
        cxx: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC 15 or Clang 21, CMake, Ninja and GoogleTest
        env:
          CXX_KIND: ${{ matrix.cxx }}
        run: bash .github/scripts/install_cxx.sh "$CXX_KIND"
      - name: Configure (Release)
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          cmake -S "cpp/$ENGINE" -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            --no-warn-unused-cli \
            -DEQOPT_WERROR=ON -DFXOPT_WERROR=ON -DEQVAR_WERROR=ON -DFXVAR_WERROR=ON
      - name: Build
        run: cmake --build "$RUNNER_TEMP/build" -j 4
      - name: ctest
        run: |
          ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure -j 4 \
            --output-junit "$RUNNER_TEMP/junit/junit.xml"
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-cpp-${{ matrix.engine }}-${{ matrix.cxx }}
          path: ${{ runner.temp }}/junit/junit.xml
          if-no-files-found: error
          retention-days: 30

  cpp-asan:
    name: cpp ${{ matrix.engine }} (clang asan+ubsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [equity-options-engine, equity-var-engine, fx-options-engine, fx-var-engine]
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 21, CMake, Ninja and GoogleTest
        run: bash .github/scripts/install_cxx.sh clang
      - name: Configure (sanitizers)
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          san="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S "cpp/$ENGINE" -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="$san" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            --no-warn-unused-cli \
            -DEQOPT_WERROR=ON -DFXOPT_WERROR=ON -DEQVAR_WERROR=ON -DFXVAR_WERROR=ON
      - name: Build
        run: cmake --build "$RUNNER_TEMP/build" -j 4
      - name: ctest
        run: ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure -j 2

  rust:
    name: rust ${{ matrix.crate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [equity-options-engine, equity-var-engine, fx-options-engine, fx-var-engine]
    env:
      RUST_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/${{ matrix.crate }}
      - name: cargo test --release
        working-directory: rust/${{ matrix.crate }}
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rust"
          cargo test --release --locked 2>&1 | tee "$RUNNER_TEMP/rust/cargo-test.log"
      # Generated golden modules carry #[rustfmt::skip] so their layout matches
      # tools/gen_golden_rs.py and the goldens --check job.
      - name: cargo fmt --check
        working-directory: rust/${{ matrix.crate }}
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: rust/${{ matrix.crate }}
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Upload cargo test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ matrix.crate }}
          path: ${{ runner.temp }}/rust/cargo-test.log
          if-no-files-found: error
          retention-days: 30

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pattern is written with a character class so this file does not
      # match itself.
      - name: Banned hiring-process word must not appear anywhere
        run: |
          if git grep -niI 'intervie[w]'; then
            echo "::error::banned word found (see matches above)"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Voice report (em-dashes, banned phrases; report-only)
        run: python .github/scripts/style_report.py

  counts:
    name: counts
    needs: [python, cpp, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{junit-*,rust-*}"
          path: ${{ runner.temp }}/artefacts
      - name: Aggregate executed test counts
        run: |
          python .github/scripts/aggregate_counts.py "$RUNNER_TEMP/artefacts" \
            -o counts.json --ref-python 3.12 --ref-cxx gcc
          {
            echo '## Executed test counts'
            echo '```json'
            python -c 'import json; print(json.dumps(json.load(open("counts.json"))["totals"], indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload counts.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counts
          path: counts.json
          if-no-files-found: error
          retention-days: 90
      - name: Docs quote the executed counts
        env:
          QP_COUNTS_JSON: ${{ github.workspace }}/counts.json
        run: |
          python -m pip install pytest
          python -m pytest -p no:cacheprovider -q tests/test_docs_counts.py

  ci-ok:
    name: ci-ok
    needs: [discover, python, goldens, cpp, cpp-asan, rust, hygiene, counts]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::jobs not successful: $bad"
            exit 1
          fi
