# Model inventory (W11). One [[model]] table per model.
#
# A model is any function or class whose output is a price, a sensitivity,
# a risk measure or a forecast (SR 11-7 section III; PRA SS1/23 principle 1).
# Field meanings and the review process are in docs/models/README.md; the
# per-model validation write-up follows docs/models/VALIDATION_TEMPLATE.md.
#
# Checked by tests/test_model_inventory.py and
#   python -m qp_core.model check docs/models/models.toml
#
# Every entrypoint carries @model(id=...). A future entry whose tag is not
# applied yet sets decorated = false; the check fails if flag and source disagree.

[[model]]
id = "CORE-BS-CARRY"
name = "Black-Scholes-Merton with continuous carry (shared kernel)"
owner = "maintainer"
tier = 1
kind = "price"
purpose = "European price and Greeks for every Python options package; the C++ and Rust kernels port it."
entrypoints = [
  "python/core/src/qp_core/black_scholes.py::carry_price",
  "python/core/src/qp_core/black_scholes.py::carry_greeks",
]
assumptions = [
  "lognormal spot, constant volatility, rate and carry",
  "frictionless continuous hedging",
]
limitations = [
  "no smile, no jumps, no discrete dividends",
  "deep-OTM tails below about 1e-300 underflow to zero",
]
validation_status = "independently-checked"
validated_on = 2026-11-03
next_review = 2027-05-03
kpis = [
  "put-call parity residual <= 1e-12 x spot",
  "golden-vector worst deviation inside tolerance",
]
tests = [
  "python/core/tests/test_black_scholes.py::test_worked_example",
  "python/core/tests/test_black_scholes.py::test_put_call_parity",
]
independent_checks = [
  "python/equity/01-options-pricing/tests/test_golden.py::test_record_matches_oracle",
  "python/equity/01-options-pricing/tests/test_differential.py::test_rust_matches_python",
  "python/equity/01-options-pricing/tests/test_differential.py::test_cpp_matches_python",
]

