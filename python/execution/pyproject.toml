[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qp-exec"
version = "3.0.0.dev0"
description = "Execution research stack: a price-time reference limit order book with exchange order types, order-flow simulators, fills and markouts, impact fitting, Hawkes order-flow models and execution schedules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qp_exec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/qp_exec"]
addopts = "-q --doctest-modules --import-mode=importlib"
