[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-port"
version = "1.0.0"
description = "Equity portfolio optimization & risk allocation: shrunk return estimation (James-Stein, Black-Litterman), Ledoit-Wolf covariance shrinkage from scratch, closed-form and constrained mean-variance optimization, efficient frontier, equal-risk-contribution (risk parity) via cyclical coordinate descent, and a no-lookahead walk-forward backtester with exact turnover/cost accounting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
