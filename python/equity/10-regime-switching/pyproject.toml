[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-regime"
version = "1.0.0"
description = "Equity regime-switching strategy: regime features, from-scratch PCA / Gaussian mixture / Gaussian HMM (cross-checked vs scikit-learn and hmmlearn), online filtered-probability regime detection, hysteresis-banded regime-conditional allocation with vol targeting, walk-forward backtest and regime-conditional risk analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
crosscheck = ["scikit-learn>=1.3", "hmmlearn>=0.3"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "scikit-learn>=1.3", "hmmlearn>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
