[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-var"
version = "1.0.0"
description = "Equity market risk engine: historical / parametric / Monte Carlo VaR, Expected Shortfall, Kupiec-Christoffersen backtesting, Basel traffic light, stress testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-core>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# The legacy-behaviour tests of the two deprecated entry points below stay for
# one release; their DeprecationWarning is expected there.
filterwarnings = [
    "error::RuntimeWarning",
    'ignore:filtered_historical_var\(pnl:DeprecationWarning',
    "ignore:cornish_fisher_domain_ok is deprecated:DeprecationWarning",
]
