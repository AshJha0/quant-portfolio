[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-pairs"
version = "1.0.0"
description = "Equity statistical pairs trading: correlation/SSD screens, Engle-Granger cointegration with MacKinnon EG critical values, Ornstein-Uhlenbeck spread modelling, z-score signals, event-driven backtest with transaction costs, walk-forward validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
