[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-pairs"
version = "3.0.0"
description = "Equity statistical pairs trading on synthetic data: correlation/SSD screens, Engle-Granger cointegration with MacKinnon critical values, Ornstein-Uhlenbeck spreads, z-score signals, next-period-fill backtest with impact, borrow and financing costs, walk-forward validation, deflated Sharpe and PBO."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-bt>=3.0.0",
    "qp-core>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "hypothesis>=6.100", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type information.
eq_pairs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
