[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fi-rates"
version = "1.0.0"
description = "Fixed income pricing & risk analytics: yield curve bootstrapping, bond pricing (YTM, z-spread, FRN), duration/convexity/DV01, key-rate durations, scenario analysis and carry/roll-down."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
live = []          # FRED loader uses only stdlib urllib + pandas; guard is at import time
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::fi_rates.curve.ExtrapolationWarning",
]
