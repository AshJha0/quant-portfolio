[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fi-rates"
version = "3.0.0"
description = "Fixed income pricing & risk analytics: yield curve bootstrapping, bond pricing (YTM, z-spread, FRN), duration/convexity/DV01, key-rate durations, scenario analysis and carry/roll-down."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-core>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
live = []          # FRED loader uses only stdlib urllib + pandas; guard is at import time
test = ["pytest>=7.4", "hypothesis>=6.100"]
dev = ["pytest>=7.4", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type information.
fi_rates = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::fi_rates.curve.ExtrapolationWarning",
]
