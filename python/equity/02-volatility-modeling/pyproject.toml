[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-vol"
version = "1.0.0"
description = "Equity volatility modeling & forecasting: historical/range estimators, EWMA, GARCH(1,1), EGARCH(1,1), GJR-GARCH(1,1), forecasting and forecast evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "arch>=6.0"]
live = ["yfinance>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning",
]
