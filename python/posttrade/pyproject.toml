[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qp-posttrade"
version = "3.0.0.dev0"
description = "Post-trade for quant-portfolio: booking and settlement dates, confirmations, TCA, best-execution templates and surveillance detectors (synthetic venue)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qp_posttrade = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/qp_posttrade"]
addopts = "-q --doctest-modules --import-mode=importlib"
