[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-options"
version = "1.0.0"
description = "FX options pricing & Greeks engine: Garman-Kohlhagen, binomial, Black-76, Monte Carlo, FX delta conventions, delta hedging"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
