[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-rates"
version = "1.0.0"
description = "FX-linked fixed income: multi-currency curve bootstrapping, CIP forward curves, cross-currency basis, FX forward/swap and cross-currency swap pricing and risk (DV01/KRD per currency, basis DV01, scenario engine, CIP arbitrage detector)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
