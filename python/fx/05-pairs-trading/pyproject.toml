[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-pairs"
version = "3.0.0"
description = "FX statistical pairs / cross-rate mean-reversion trading: cross construction, Engle-Granger cointegration, OU spread modelling, carry-adjusted backtesting with pip costs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-core>=1.0",
    "qp-bt>=3.0.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pandas>=3.1.1",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "hypothesis>=6.170.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type information.
fx_pairs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
]
