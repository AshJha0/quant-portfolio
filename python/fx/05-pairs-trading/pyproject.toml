[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-pairs"
version = "1.0.0"
description = "FX statistical pairs / cross-rate mean-reversion trading: cross construction, Engle-Granger cointegration, OU spread modelling, carry-adjusted backtesting with pip costs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
]
