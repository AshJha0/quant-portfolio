[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-var"
version = "3.0.0.dev0"
description = "FX market risk: VaR & Expected Shortfall engine for a multi-currency book (historical, parametric, Monte Carlo, backtesting, Basel traffic light, stress testing)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-core>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.100", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type information.
fx_var = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
    # fx_var's own deprecated entry points must only be hit on purpose
    "error::DeprecationWarning:fx_var.*",
]
