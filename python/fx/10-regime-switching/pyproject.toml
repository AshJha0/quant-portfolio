[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-regime"
version = "1.0.0"
description = "FX regime-switching quant strategy (risk-on/risk-off): FX-native feature engineering (G10 vol analog, carry-basket returns, safe-haven relative strength, USD-pair correlation, EM-vs-G10 spread, forward-point term structure), PCA / GMM / HMM implemented from scratch (sklearn & hmmlearn used only as cross-checks), point-in-time filtered regime detection with hysteresis and economic labeling, regime-conditional carry / safe-haven / long-USD baskets with carry accrual and pip costs, walk-forward backtesting, and oracle-vs-filtered detection-lag risk analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
]
