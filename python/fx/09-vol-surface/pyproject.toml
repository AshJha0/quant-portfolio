[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-surface"
version = "1.0.0"
description = "FX volatility surface from delta-space quotes (ATM/RR/BF), vanna-volga & SVI smiles, Garman-Kohlhagen, Heston calibration, pricing, and Greeks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashish Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
