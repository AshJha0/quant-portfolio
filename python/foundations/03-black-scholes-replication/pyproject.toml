[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-bs-replication"
version = "3.0.0.dev0"
description = "From-scratch, zero-scipy Black-Scholes-Merton replication: closed-form pricing/Greeks (math.erfc only), an independent Monte Carlo cross-check, and a controlled experiment showing the vol smile emerge under fat-tailed pricing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "hypothesis>=6.80"]
dev = ["pytest>=7.4", "hypothesis>=6.80"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type information.
eq_bs_replication = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
