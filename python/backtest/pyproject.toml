[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qp-bt"
version = "3.0.0"
description = "One event-driven backtest core (event mode and a fast weight mode) shared by the quant-portfolio strategy projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
dependencies = [
    "qp-core>=3.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# qp-exec: the W25 reference book the queue-fill tests bind to. scikit-learn:
# the independent Ledoit-Wolf check (model BT-COV-LW).
dev = ["pytest>=7.4", "hypothesis>=6.0", "qp-exec>=3.0.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qp_bt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
